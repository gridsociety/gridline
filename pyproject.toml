[project]
name = "gridsociety-gridline"
version = "0.1.0"
description = "Agent-guided electrical single-line diagrams with QElectroTech and Documentor"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["mcp==1.26.0", "PyMuPDF==1.27.2.3"]

[project.scripts]
gridline = "gridline.cli:main"
qelectrotech-mcp = "qelectrotech_mcp.server:main"

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gridline", "src/qelectrotech_mcp"]

[dependency-groups]
dev = ["pytest>=8.4,<9"]

[tool.uv]
# Preserve a binary distribution on the supported Intel macOS workstation.
constraint-dependencies = ["cryptography<47"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: requires Documentor, Chromium and local subprocesses"]
