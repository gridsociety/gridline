<!doctype html>
<html lang="it"><head><meta charset="UTF-8">
<meta name="documentor-browser-header-footer" content="none">
<title>{{ document.code }} {{ document.revision }}</title>
<style>
html,body {margin:0;padding:0;} * {box-sizing:border-box;}
{% for s in sheets %}
@page sheet{{loop.index}} {size:{{s.width_mm}}mm {{s.height_mm}}mm !important; margin:0;}
.sheet-{{loop.index}} {page:sheet{{loop.index}};width:{{s.width_mm}}mm;height:{{s.height_mm}}mm;}
{% endfor %}
section {display:block;position:relative;break-after:page;overflow:hidden;margin:0;padding:0;}
section:last-of-type {break-after:auto;}
img {display:block;width:100%;height:100%;}
.registry {position:absolute;top:17mm;right:18mm;font:6pt Arial;color:#263b43;}
</style></head><body>
{% for s in sheets %}<section class="sheet-{{loop.index}}">
<img src="/static/{{s.svg_path}}" alt="{{s.title}}">
<div class="registry">Documentor DRAFT · {{document.code}} · {{document.revision}}</div>
</section>{% endfor %}
</body></html>
